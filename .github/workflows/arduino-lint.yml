# yaml-language-server: $schema=https://github.com/SchemaStore/schemastore/raw/master/src/schemas/json/github-workflow.json

# Arduino library specification compliance.
#
# This workflow was disabled with `on: workflow_dispatch` and a "TODO Remove"
# comment, so it never ran - the same shape as the CodeQL and spell-check
# workflows. When it finally did run, it found that library.properties pointed
# at a URL that 404s and that the library had no header named after itself.
#
# It was also configured with `library-manager: update`, which asserts that the
# library is already in the Library Manager index. It is not, so that mode could
# never have passed regardless of the code.
#
# `library-manager: false` runs the specification rules and skips the ones that
# only matter for getting listed in the index. One of those is still failing:
# three tracked .exe files - Windows tooling referenced by the reverse-
# engineering notes - block addition to the index. Removing them is a decision
# for the maintainer, and until it is made, running in `submit` mode would
# report a failure nobody intends to act on. See PRODUCTION_READINESS.md, K10.

name: Arduino-Lint

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "library.json"
      - "keywords.txt"
      - ".github/workflows/arduino-lint.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - "library.json"
      - "keywords.txt"
      - ".github/workflows/arduino-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v2
        with:
          # strict - enforces best practices, above and beyond the minimum
          #          requirements for specification compliance.
          compliance: strict
          # See the note at the top of this file for why this is not `submit`.
          library-manager: false
          project-type: library
