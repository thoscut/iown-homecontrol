# yaml-language-server: $schema=https://github.com/SchemaStore/schemastore/raw/master/src/schemas/json/github-workflow.json

# PlatformIO Build Workflow
#   https://docs.platformio.org/en/latest/integration/ci/github-actions.html

# Only tests for the standard enviroment defined in the platformio.ini!

# TODO Get Version Name in here! (hint: see scripts/ci)

name: PlatformIO
# run-name: Deploy to ${{ inputs.deploy_target }} by @${{ github.actor }}

# NOTE: path filters need globs. Bare directory names like `src` match a *file*
#       called `src`, so the previous filter never matched and this workflow
#       effectively never ran.
on:
  push:
    branches: [ "main" ]
    paths:
      - "data/**"
      - "include/**"
      - "src/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/platformio.yml"
  pull_request:
    paths:
      - "data/**"
      - "include/**"
      - "src/**"
      - "lib/**"
      - "platformio.ini"
      - ".github/workflows/platformio.yml"
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# TODO Set enviroment variable for later use
# env:
#   BUILD: GITHUB

jobs:
  build:
    name: PlatformIO Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            path:
              ~\AppData\Local\pip\Cache
              ~\.platformio\.cache
          - os: ubuntu-latest
            path:
              ~/.cache/pip
              ~/.platformio/.cache
          - os: macos-latest
            path:
              ~/Library/Caches/pip
              ~/.platformio/.cache

    permissions:
      actions: read          # private repos
      contents: write        # private repos
      packages: read         # fetch internal or private CodeQL packs
      security-events: write # all workflows

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Setup Cache
      uses: actions/cache@v4
      with:
        key:
          ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          ${{ runner.os }}-pio
        path: ${{ matrix.path }}
        restore-keys:
          ${{ runner.os }}-pip-
          ${{ runner.os }}-pio
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
        check-latest: true # is cached version latest?
        cache: pip         # caching pip dependencies
    - name: 'PlatformIO: Install Core'
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: 'PlatformIO: Show Project Config'
      run: pio project config
    - name: 'PlatformIO: Build Project'
      run: pio run

  boards:
    name: Board table
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # `pio run` builds only `default_envs`, so the matrix job above has always
    # compiled exactly one board. That is how four entries in
    # src/board_pins.h came to be keyed on macro names PlatformIO does not
    # define - TTGO v2.1, TTGO v1, T-Beam and Heltec V3 all fell through to
    # "unknown board" and nothing said so.
    #
    # This job builds every board environment, so a misspelled macro trips the
    # #error in board_pins.h and turns CI red.

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
    - name: Setup Cache
      uses: actions/cache@v4
      with:
        key: ${{ runner.os }}-pio-boards
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        restore-keys: ${{ runner.os }}-pio-
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x
        cache: pip
    - name: 'PlatformIO: Install Core'
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
    - name: 'PlatformIO: Build every board environment'
      run: |
        set -euo pipefail
        envs=$(pio project config --json-output \
               | python -c "import json,sys; print(' '.join(n[4:] for n,_ in json.load(sys.stdin) if n.startswith('env:')))")
        echo "environments: ${envs}"
        args=""
        for env in ${envs}; do
          # `native` has no board and `debug` is the default board again.
          case "${env}" in
            native|debug) continue ;;
          esac
          args="${args} -e ${env}"
        done
        if [ -z "${args}" ]; then
          echo "no board environments found - did platformio.ini change shape?" >&2
          exit 1
        fi
        # shellcheck disable=SC2086
        pio run ${args}
