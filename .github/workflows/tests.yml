# yaml-language-server: $schema=https://github.com/SchemaStore/schemastore/raw/master/src/schemas/json/github-workflow.json

# Protocol library unit tests.
#
# These run on the host with no PlatformIO toolchain and no radio hardware, so
# they are fast enough to gate every push. AddressSanitizer and
# UndefinedBehaviorSanitizer are on: the frame parser eats attacker-controlled
# bytes, and a sanitizer failure there is a real finding.

name: Unit Tests

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "test/**"
      - "tools/**"
      - "platformio.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "tools/**"
      - "platformio.ini"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run protocol unit tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: ./tools/run_native_tests.sh

  strict-warnings:
    name: Warnings as errors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile with warnings as errors
        run: |
          set -euo pipefail
          FLAGS=(
            -std=c++17
            -Wall -Wextra -Wshadow -Wconversion -Wsign-conversion
            -Werror
            -DUNIT_TEST -DIOHOME_FORCE_SOFTWARE_AES
            -I src
          )
          for source in src/protocol/*.cpp src/velux/*.cpp; do
            echo "=== ${source}"
            g++ "${FLAGS[@]}" -c "${source}" -o /dev/null
          done
          # IoHomeControl needs a RadioLib header; the test mock provides one.
          echo "=== src/IoHomeControl.cpp"
          g++ "${FLAGS[@]}" -I test/mocks -c src/IoHomeControl.cpp -o /dev/null

      - name: Compile the C headers as C
        run: |
          set -euo pipefail
          # include/ is written as C with `extern "C"` blocks. It had never been
          # compiled as C, and it did not: iown_node_types.h used a C++ `enum
          # class` inside one of those blocks. Build a probe that touches every
          # public macro so a regression shows up as a failure, not a surprise
          # for whoever first tries to use these from C.
          cat > /tmp/c_probe.c <<'PROBE'
          #include "iown.h"
          #include "iown_node_types.h"
          int main(void) {
            enum iown_node_actuator_types t = IOWN_NODE_WINDOW_OPENER;
            unsigned char id[IOWN_LEN_NODEID] = {0x00, 0x00, 0x3F};
            return (int)t
                 + IOWN_IS_BROADCAST_ADDR(id)
                 + IOWN_FRAME_SIZE(0xF8)
                 + IOWN_FRAME_LEN(0xF8)
                 + IOWN_FRAME_LEN_MAX
                 + IOWN_LEN_FRAME(IOWN_MODE_1W, 6)
                 + IOWN_LEN_FRAME(IOWN_MODE_2W, 6)
                 + IOWN_LEN_PACKET_PLAIN(6)
                 + IOWN_LEN_SYNC_WORD;
          }
          PROBE
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -I include \
              -c /tmp/c_probe.c -o /dev/null
          echo "include/ compiles as C"

          # The size field encodes "total length minus Control Byte 0 minus the
          # CRC". The capture in scripts/io-homecontrol.ksy has size 24 and is
          # 27 bytes long, so the bias is 3. The original code used 11.
          cat > /tmp/c_assert.c <<'ASSERT'
          #include "iown.h"
          _Static_assert(IOWN_FRAME_LEN(0xF8) == 27, "size field bias must be 3");
          _Static_assert(IOWN_FRAME_LEN_MAX == 34, "5-bit size field tops out at 34 bytes");
          _Static_assert(IOWN_LEN_SYNC_WORD == 3, "sync word is 57 FD 99");
          _Static_assert(IOWN_LEN_FRAME(IOWN_MODE_1W, 8) == 27, "ksy capture is 27 bytes");
          int main(void) { return 0; }
          ASSERT
          gcc -std=c11 -Wall -Wextra -Werror -I include -c /tmp/c_assert.c -o /dev/null
          echo "frame length macros agree with the captures"

  radiolib-mock:
    name: RadioLib mock matches upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The native build compiles against test/mocks/RadioLib.h. A constant that
    # exists only in the mock passes here and then breaks the firmware build
    # minutes later - RADIOLIB_ERR_INVALID_RADIO did exactly that. Comparing
    # the mock against the pinned upstream catches the drift in seconds.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch the pinned RadioLib
        run: |
          set -euo pipefail
          # Read the pin from platformio.ini so the two cannot disagree.
          version="$(sed -nE 's#.*jgromes/RadioLib@([0-9]+\.[0-9]+\.[0-9]+).*#\1#p' platformio.ini | head -1)"
          if [ -z "${version}" ]; then
            echo "could not read an exact RadioLib version from platformio.ini" >&2
            exit 1
          fi
          echo "RadioLib pin: ${version}"
          git clone --quiet --depth 1 --branch "${version}" \
            https://github.com/jgromes/RadioLib.git "${RUNNER_TEMP}/RadioLib"
          echo "RADIOLIB_DIR=${RUNNER_TEMP}/RadioLib" >> "${GITHUB_ENV}"

      - name: Compare mock against upstream
        run: ./tools/check_radiolib_mock.sh
