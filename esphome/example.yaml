# ESPHome configuration example for io-homecontrol
#
# This example shows how to use the iown_homecontrol component to
# control Somfy/Velux blinds and shutters via the io-homecontrol protocol.
#
# IMPORTANT: This is experimental. The io-homecontrol protocol implementation
# is still work in progress. Use at your own risk, and read
# docs/SECURITY-MODEL.md before pairing anything you care about.
#
# Supported radio modules: SX1276 (default), SX1262
# Supported boards: Any ESP32 with a compatible LoRa radio module
#
# Common board pin configurations:
#
# An SX127x interrupts on DIO0; an SX126x has no DIO0 at all - it interrupts on
# DIO1 and needs its BUSY line. Give the pins the names they have on the board;
# the component knows which slot each family wants them in.
#
#   Heltec WiFi LoRa 32 V2 / V2.1 (SX1276):
#     cs_pin: 18, rst_pin: 14, dio0_pin: 26, dio1_pin: 33
#     sck_pin: 5, mosi_pin: 27, miso_pin: 19
#
#   Heltec WiFi LoRa 32 V3 (SX1262):
#     cs_pin: 8, rst_pin: 12, dio1_pin: 14, busy_pin: 13
#     sck_pin: 9, mosi_pin: 10, miso_pin: 11
#     (this used to read `dio0_pin: 14, dio1_pin: 13` - a swap that compensated
#      for the pins being handed to RadioLib in the SX127x order)
#
#   TTGO LoRa32 V2.1 (SX1276):
#     cs_pin: 18, rst_pin: 23, dio0_pin: 26, dio1_pin: 33
#     sck_pin: 5, mosi_pin: 27, miso_pin: 19

esphome:
  name: iown-homecontrol
  friendly_name: "io-homecontrol Gateway"

esp32:
  board: heltec_wifi_lora_32_V2
  framework:
    type: arduino

# Load the iown_homecontrol component
# Option 1: From local path (for development)
external_components:
  - source:
      type: local
      path: components

# Option 2: From GitHub (for production use)
# external_components:
#   - source:
#       type: git
#       url: https://github.com/thoscut/iown-homecontrol
#       ref: main
#     components: [iown_homecontrol]

# io-homecontrol hub configuration
iown_homecontrol:
  id: iohc_hub
  cs_pin: 18            # SPI Chip Select
  rst_pin: 14           # Radio Reset
  dio0_pin: 26          # Radio DIO0 / IRQ
  dio1_pin: 33          # Radio DIO1
  # Custom SPI pins are optional, but must be given as a complete set.
  sck_pin: 5            # SPI Clock
  mosi_pin: 27          # SPI MOSI
  miso_pin: 19          # SPI MISO

  # Radio configuration
  radio_type: SX1276    # SX1276 or SX1262
  frequency: 868.95     # Channel 2 (used by 1W, and the 2W default)

  # This gateway's own 3-byte node address. Pick something that does not
  # collide with a device you already own.
  source_address: 0x1A380B

  # Authentication
  #
  # Actuators only obey authenticated frames once they have been paired, so
  # leaving this off is for sniffing and first experiments only.
  #
  # The key must be the 16-byte system key your installation already uses; see
  # docs/SECURITY-MODEL.md for where it comes from. Keep it in secrets.yaml -
  # anyone holding it can operate every actuator in the installation.
  # encryption_enabled: true
  # system_key: !secret iohc_system_key

  # Command metadata sent with every execute frame.
  # ACEI bit 0 must be set or actuators discard the frame; 0x61 is
  # "user priority level 2, valid", which is what a remote control sends.
  acei: 0x61
  originator: USER

  # Experimental: update cover positions from frames the actuators send.
  # Off by default because those frames are not authenticated here, so a
  # spoofed frame could show a wrong position in Home Assistant.
  position_feedback: false

# Cover entities for io-homecontrol blinds/shutters
cover:
  - platform: iown_homecontrol
    name: "Living Room Blind"
    # 0x00003F is the broadcast address: every actuator in range reacts to it.
    # Useful for a first test, but replace it with the real node address.
    target_address: 0x00003F
    full_open_duration: 30s
    full_close_duration: 30s
    restore_mode: NO_RESTORE

  # Example: a venetian blind with slat control on a specific address
  # - platform: iown_homecontrol
  #   name: "Bedroom Blind"
  #   target_address: 0xABCDEF
  #   supports_tilt: true
  #   full_open_duration: 22s
  #   full_close_duration: 20s
  #   restore_mode: RESTORE

# Diagnostics: link quality and receive-path counters
sensor:
  - platform: iown_homecontrol
    iown_homecontrol_id: iohc_hub
    update_interval: 60s
    rssi:
      name: "io-homecontrol RSSI"
    frames_received:
      name: "io-homecontrol Frames Received"
    crc_errors:
      name: "io-homecontrol CRC Errors"

# WiFi configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot in case WiFi connection fails
  ap:
    ssid: "IOWN-Homecontrol"
    password: !secret ap_password

# Enable logging (set to DEBUG to see received frames)
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password
