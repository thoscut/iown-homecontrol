# https://arduino.github.io/arduino-cli/dev/library-specification/
#
# `architectures` is esp32, not *: the library includes Arduino.h and the
# ESP-IDF driver/spi_master.h (include/esp32_api_spi.h, src/esp32_api_spi.cpp)
# and its IoHomeControl / NVS code targets the ESP32 core, so it does not build
# on other cores. There is no license field in this format; the license is the
# repository's LICENSE file (CC0 1.0 Universal), matching library.json.
#
# The Arduino IDE compiles everything under src/, including the firmware entry
# point src/main.cpp. That file compiles to nothing unless IOHC_FIRMWARE_MAIN is
# defined, which only this repository's platformio.ini does.
#
# The format is strict: `key=value`, no spaces around the `=` and no quotes.
# Values written as `key = "value"` are rejected by the Arduino Library Manager,
# and `includes` must name a header that actually exists in src/ - the previous
# value, iown_homecontrol.h, never did.
#
# `url` must resolve: arduino-lint fetches it, and Library Manager submission
# fails on a dead link. It pointed at https://velocet.github.io/iown-homecontrol,
# which 404s - the Pages site is not published. This is the repository URL,
# which does resolve; point it at upstream instead if that is preferred.
#
# `includes` names the header a sketch should include. It is now the umbrella
# header src/iown-homecontrol.h, which matches the library name - the Arduino
# specification asks for that and arduino-lint warns when it is missing.
#
# NOTE: Place internal header files in a subfolder of the src/ folder!
#       In general, only header files in src/ should be exposed to the user's
#       sketch to maintain compatibility with future versions of the library.
